<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Homologação CEM – Alumisoft</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--tk:#6D28D9;--tk-bg:#EDE4FC;--bg:#F3F6F9;--surface:#fff;--surface-2:#F7F9FB;--line:#E1E8EF;--text:#0B2239;--text-2:#52667A;--text-3:#8496A8;--navy:#082745;--navy-2:#0D3A66;--teal:#00A8B3;--teal-soft:#E0F6F7;--yellow:#FFCC29;
--ok:#2FA35A;--ok-bg:#E3F5EA;--err:#C77700;--err-bg:#FFF1D9;--att:#D6323A;--att-bg:#FDE5E6;--na:#6B7C8D;--na-bg:#E9EEF2;--pend-bg:#EEF2F6;--shadow:0 1px 2px rgba(8,39,69,.06),0 6px 20px rgba(8,39,69,.06);--hdr:#082745;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tk:#B79BFF;--tk-bg:#2B1B52;--bg:#061523;--surface:#0B2540;--surface-2:#0E2D4C;--line:#1C3C5E;--text:#E7EEF5;--text-2:#9FB3C8;--text-3:#6F869D;--teal-soft:#0A3D4A;--ok:#4CC27C;--ok-bg:#12382A;--err:#F5A524;--err-bg:#3D2E0E;--att:#FF6B72;--att-bg:#47191C;--na:#9DB0C2;--na-bg:#1B3350;--pend-bg:#12304F;--hdr:#04101C;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--tk:#B79BFF;--tk-bg:#2B1B52;--bg:#061523;--surface:#0B2540;--surface-2:#0E2D4C;--line:#1C3C5E;--text:#E7EEF5;--text-2:#9FB3C8;--text-3:#6F869D;--teal-soft:#0A3D4A;--ok:#4CC27C;--ok-bg:#12382A;--err:#F5A524;--err-bg:#3D2E0E;--att:#FF6B72;--att-bg:#47191C;--na:#9DB0C2;--na-bg:#1B3350;--pend-bg:#12304F;--hdr:#04101C;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 'Inter','Segoe UI',system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.disp{font-family:'Exo 2','Segoe UI',system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
.top{background:var(--hdr);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:30;border-bottom:3px solid var(--teal)}
.top img{height:30px;display:block}
.top .ttl{font-family:'Exo 2',sans-serif;font-weight:700;font-size:17px;letter-spacing:.5px;padding-left:14px;border-left:1px solid rgba(255,255,255,.25)}
.top .sp{flex:1}
.top select{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25);max-width:280px}
.top select option{color:#0B2239;background:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--att)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.top .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.top .btn.pri{background:var(--teal);border-color:var(--teal)}
.sync{font-size:12px;color:#B8CBDD;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#4CC27C;display:inline-block}
.sync.saving i{background:var(--yellow);animation:pu 1s infinite}.sync.error i{background:#FF6B72}
@keyframes pu{50%{opacity:.3}}
.tabs{display:flex;gap:4px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:55px;z-index:20}
.tabs button{border:0;background:none;padding:13px 16px;font-weight:600;color:var(--text-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--teal)}
.tabs .cnt{background:var(--att-bg);color:var(--att);border-radius:10px;padding:0 7px;font-size:11px;margin-left:6px}
main{padding:20px;max-width:1500px;margin:0 auto}
.banner{background:var(--err-bg);color:var(--err);border-radius:8px;padding:8px 14px;margin-bottom:14px;font-size:13px;font-weight:600}
.hhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--pend-bg) 0)}
.ring b{width:74px;height:74px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:'Exo 2';font-size:21px}
.hhead h2{font-size:24px}.muted{color:var(--text-2)}.tiny{font-size:12px;color:var(--text-3)}
.chip-s{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
.chip-s.fin{background:var(--ok-bg);color:var(--ok)}.chip-s.and{background:var(--teal-soft);color:var(--teal)}.chip-s.nao{background:var(--pend-bg);color:var(--text-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-left:5px solid var(--c)}
.kpi b{display:block;font-family:'Exo 2';font-size:30px;line-height:1.1}
.kpi span{font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px;margin-bottom:14px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{font-size:15px;margin-bottom:10px}
.card.wide{grid-column:1/-1}
.cv{position:relative}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-2);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.c,table.t th.c{text-align:center}
.bar{height:8px;background:var(--pend-bg);border-radius:6px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--teal)}
.n-err{color:var(--err);font-weight:700}.n-att{color:var(--att);font-weight:700}
.link{background:none;border:0;color:var(--teal);font-weight:600;padding:0;text-align:left}
.link:hover{text-decoration:underline}
/* checklist */
.cl{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
.alist{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:8px;position:sticky;top:120px;max-height:calc(100vh - 140px);overflow:auto}
.alist button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px}
.alist button:hover{background:var(--surface-2)}.alist button.on{background:var(--teal-soft)}
.alist .nm{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:13px}
.alist .mt{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:var(--text-2)}
.alist .mt .bar{flex:1;min-width:30px;height:6px}
.dot{font-size:11px;font-weight:700;border-radius:8px;padding:0 6px}
.dot.e{background:var(--err-bg);color:var(--err)}.dot.a{background:var(--att-bg);color:var(--att)}
.abamain{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.abahead{padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.abahead h2{font-size:19px;margin-right:auto}
.tw{overflow:auto;max-height:calc(100vh - 250px)}
table.ck{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.ck th{position:sticky;top:0;background:var(--surface-2);z-index:3;padding:9px 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-2);border-bottom:2px solid var(--line);white-space:nowrap}
table.ck td{padding:4px 6px;border-bottom:1px solid var(--line)}
table.ck td.it{position:sticky;left:0;background:var(--surface);z-index:2;min-width:300px;max-width:520px;padding:7px 10px}
table.ck th.it{left:0;z-index:4;text-align:left}
table.ck tr:hover td.it,table.ck tr:hover td{background:var(--surface-2)}
table.ck td.n{color:var(--text-3);font-size:11px;text-align:right;width:34px}
.it .row{display:flex;gap:6px;align-items:flex-start}.it .row span{flex:1}
.rowact{opacity:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;padding:1px 6px;font-weight:700;color:var(--ok)}
tr:hover .rowact,.rowact:focus{opacity:1}
.cellb{position:relative;width:100%;min-width:78px;border:1px solid transparent;border-radius:7px;padding:5px 4px;font-weight:700;font-size:11.5px;text-align:center;background:var(--pend-bg);color:var(--text-3)}
.cellb:hover{border-color:var(--teal)}
.cellb.OK{background:var(--ok-bg);color:var(--ok)}.cellb.ERRO{background:var(--err-bg);color:var(--err)}.cellb.ATT{background:var(--att-bg);color:var(--att)}.cellb.NA{background:var(--na-bg);color:var(--na)}
.cellb .cm{position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--teal) transparent transparent;border-radius:0 6px 0 0}
.mini{width:100%;min-width:90px;padding:4px 6px;font-size:12.5px}
.empty{padding:50px 20px;text-align:center;color:var(--text-2)}
/* popover / modal */
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.28);width:min(380px,calc(100vw - 20px));padding:14px;max-height:calc(100vh - 20px);overflow:auto}
.pop h4{margin:0 0 2px;font-size:14px}.pop .sub{font-size:12px;color:var(--text-2);margin-bottom:10px}
.sbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.sbtns button{border:2px solid transparent;border-radius:8px;padding:7px 4px;font-weight:700;font-size:12px}
.sbtns .OK{background:var(--ok-bg);color:var(--ok)}.sbtns .ERRO{background:var(--err-bg);color:var(--err)}.sbtns .ATT{background:var(--att-bg);color:var(--att)}.sbtns .NA{background:var(--na-bg);color:var(--na)}.sbtns .CL{background:var(--pend-bg);color:var(--text-2)}
.sbtns button.sel{border-color:currentColor}
.cmt{border-left:3px solid var(--teal);background:var(--surface-2);border-radius:0 8px 8px 0;padding:7px 10px;margin-bottom:8px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.cmt .who{font-size:11.5px;color:var(--text-2);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.cmt .who button{border:0;background:none;color:var(--text-3);font-size:11px;padding:0}
.card-b{background:var(--teal-soft);color:var(--teal);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:700}
.pop textarea{width:100%;min-height:64px;resize:vertical;margin-bottom:8px}
.ov{position:fixed;inset:0;background:rgba(4,16,28,.55);z-index:70;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h3{font-size:19px;margin-bottom:14px}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:12px;font-weight:700;color:var(--text-2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select,.fld textarea{width:100%}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.opt input{margin-top:3px;width:auto}
.opt small{display:block;color:var(--text-2)}
.macts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.exg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exb{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.exb:hover{border-color:var(--teal);background:var(--teal-soft)}.exb b{font-family:'Exo 2';font-size:17px}.exb span{font-size:12px;color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:90;box-shadow:0 8px 30px rgba(0,0,0,.3);font-weight:600;max-width:90vw}
.hcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.hc{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:16px;border-top:4px solid var(--teal);display:flex;flex-direction:column;gap:10px}
.hc.cur{outline:2px solid var(--teal)}
.hc h3{font-size:17px}.hc .st{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px}
.hc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.sev{font-weight:700;font-size:12px;border-radius:6px;padding:1px 8px;white-space:nowrap}.sev.a{background:var(--att-bg);color:var(--att)}.sev.e{background:var(--err-bg);color:var(--err)}
.cardsum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.load{padding:80px;text-align:center;color:var(--text-2)}
@media(max-width:860px){.cl{grid-template-columns:1fr}.alist{position:static;max-height:none;display:flex;overflow-x:auto;gap:4px}.alist button{min-width:190px}.top .ttl{display:none}main{padding:12px}.tabs{top:auto;position:static}.exg{grid-template-columns:1fr}.tw{max-height:none}}

.tabs .cnt.n{background:var(--teal-soft);color:var(--teal)}
a.card-b{text-decoration:none}a.card-b:hover{filter:brightness(.9)}
.card-b.big{font-size:14px;padding:3px 12px;white-space:nowrap}
.cbx{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;border-left:5px solid var(--teal)}
.chead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chead .ctit{flex:1;min-width:220px}.chead .cc{display:flex;gap:6px}
.cbx details{margin-top:6px}.cbx summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:13px}

.itn{flex:1;min-width:420px;width:100%;resize:none;overflow:hidden;line-height:1.35;padding:5px 8px;display:block}
.rowact.on{opacity:1;color:var(--teal);font-size:14px;padding:0 7px;line-height:1.5}.rowact.on.dng{color:var(--att)}
.hb{border:0;background:none;color:var(--text-3);padding:0 3px;font-size:11px}.hb:hover{color:var(--teal)}
tr.addrow td{padding:10px}

.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}.btn.okb:hover{filter:brightness(1.08)}
.btn.okb:disabled{opacity:.45;cursor:default;filter:none}

.drag{cursor:grab;color:var(--text-3);margin-right:6px;font-size:16px;user-select:none}.drag:active{cursor:grabbing}
table.ck td.n{width:auto;white-space:nowrap;min-width:52px}
tr.dragging td{opacity:.35}
tr.dropbefore td{box-shadow:inset 0 3px 0 var(--teal)}tr.dropafter td{box-shadow:inset 0 -3px 0 var(--teal)}

.tk-b{background:var(--tk-bg);color:var(--tk);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:700}
a.tk-b{text-decoration:none}a.tk-b:hover{filter:brightness(.9)}
.tk-b.big{font-size:14px;padding:3px 12px;white-space:nowrap}
.tabs .cnt.t{background:var(--tk-bg);color:var(--tk)}
.cbx.tk{border-left-color:var(--tk)}.cbx.tk summary{color:var(--tk)}
.cellb .cm.tk{border-color:transparent var(--tk) transparent transparent}
.sev.ok{background:var(--ok-bg);color:var(--ok)}



table.ck.edit td.it{min-width:560px;max-width:780px}
</style></head><body><div style="padding:80px;text-align:center;font-family:sans-serif">Carregando…</div>

      };
    }
  };
}

/* ===== NETLIFY DB: banco compartilhado no Netlify com sincronização em tempo real (polling) ===== */
'use strict';
function createNetlifyDb() {
  const POLL_MS = 2500, HIDDEN_MS = 15000;
  const api = async body => {
    const r = await fetch('/api/db', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), keepalive: body.op !== 'poll' && body.op !== 'list' && body.op !== 'get' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.code = j.code; throw e; }
    return j;
  };
  const snapDoc = (path, d) => ({ id: path.split('/').pop(), exists: !!d, data: () => d });
  const subs = new Set(); let cursor = 0, timer = null, polling = false, inflight = 0, lastWrite = 0;
  const write = async b => { inflight++; try { return await api(b); } finally { inflight--; lastWrite = Date.now(); } };
  const schedule = ms => { clearTimeout(timer); if (subs.size) timer = setTimeout(poll, ms == null ? (document.hidden ? HIDDEN_MS : POLL_MS) : ms); };
  async function poll() {
    if (polling || !subs.size) return; polling = true; const started = Date.now();
    try {
      const list = [...subs];
      const r = await api({ op: 'poll', since: cursor, paths: list.filter(s => s.doc).map(s => s.path), collections: list.filter(s => !s.doc).map(s => s.path) });
      // descarta respostas que podem ser anteriores a uma escrita local (evita "voltar" o que acabou de ser digitado)
      if (inflight || started < lastWrite) return;
      cursor = Math.max(cursor, r.cursor || 0);
      for (const s of subs) s.apply(r.changes || []);
    } catch (e) { console.warn('Sincronização: falha temporária', e); }
    finally { polling = false; schedule(); }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) schedule(0); });
  function subscribe(s) {
    subs.add(s); s.init().then(c => { if (!cursor) cursor = c || 0; schedule(); }, e => s.err && s.err(e));
    return () => { subs.delete(s); if (!subs.size) clearTimeout(timer); };
  }
  return {
    ping: () => api({ op: 'poll' }),
    doc(path) {
      return {
        get: async () => { const r = await api({ op: 'get', path }); return snapDoc(path, r.exists ? r.data : null); },
        set: data => write({ op: 'set', path, data }),
        update: data => write({ op: 'update', path, data }),
        delete: () => write({ op: 'delete', path }),
        onSnapshot(cb, err) {
          let ver = -1;
          return subscribe({ doc: true, path, err,
            init: async () => { const r = await api({ op: 'get', path }); ver = r.version || 0; cb(snapDoc(path, r.exists ? r.data : null)); },
            apply: ch => ch.forEach(c => { if (c.path !== path || c.version <= ver) return; ver = c.version; cb(snapDoc(path, c.deleted ? null : c.data)); })
          });
        }
      };
    },
    collection(path) {
      return {
        get: async () => { const r = await api({ op: 'list', collection: path }); return { docs: r.docs.map(d => snapDoc(path + '/' + d.id, d.data)) }; },
        onSnapshot(cb, err) {
          const m = new Map();
          const emit = changes => { if (!changes.length) return; const docs = [...m.entries()].map(([id, v]) => snapDoc(path + '/' + id, v.data)); cb({ docs, docChanges: () => changes }); };
          return subscribe({ doc: false, path, err,
            init: async () => { const r = await api({ op: 'list', collection: path }); r.docs.forEach(d => m.set(d.id, d)); const docs = r.docs.map(d => snapDoc(path + '/' + d.id, d.data)); cb({ docs, docChanges: () => docs.map(doc => ({ type: 'added', doc })) }); return r.cursor; },
            apply: ch => {
              const out = [];
              ch.forEach(c => {
                if (c.parent !== path) return; const cur = m.get(c.id); if (cur && c.version <= cur.version) return;
                if (c.deleted) { if (cur) { m.delete(c.id); out.push({ type: 'removed', doc: snapDoc(c.path, cur.data) }); } return; }
                m.set(c.id, c); out.push({ type: cur ? 'modified' : 'added', doc: snapDoc(c.path, c.data) });
              });
              emit(out);
            }
          });
        }
      };
    }
  };
}

/* ===== BACKUP AUTOMÁTICO (File System Access API: Chrome/Edge) ===== */
'use strict';
const Backup = {
  INTERVAL: 2 * 60 * 60 * 1000, dir: null, state: 'off', timer: null, busy: false,
  supported() { return 'showDirectoryPicker' in window && window.top === window; },
  _db() { return new Promise((res, rej) => { const r = indexedDB.open('cemh-backup', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async _get() { const d = await this._db(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get('dir'); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); },
  async _put(h) { const d = await this._db(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); if (h) t.objectStore('kv').put(h, 'dir'); else t.objectStore('kv').delete('dir'); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async init() {
    if (!this.supported()) { this.state = 'unsupported'; return this.paint(); }
    try {
      const h = await this._get(); if (h && localStorage.getItem('cemh:bkOn') === '1') { this.dir = h; const p = await h.queryPermission({ mode: 'readwrite' }); this.state = p === 'granted' ? 'ok' : 'perm'; this.start(); }
    } catch (e) { console.warn('Backup: não foi possível restaurar a pasta', e); }
    this.paint();
  },
  start() { clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 60000); setTimeout(() => this.tick(), 3000); },
  async tick() { if (this.state !== 'ok' || !App.H || this.busy) return; const last = +localStorage.getItem('cemh:bkLast') || 0; if (Date.now() - last >= this.INTERVAL) await this.run(false); },
  async choose() {
    const h = await window.showDirectoryPicker({ id: 'cemh-backup', mode: 'readwrite', startIn: 'documents' });
    await this._put(h); this.dir = h; localStorage.setItem('cemh:bkOn', '1'); this.state = 'ok'; this.start(); this.paint(); await this.run(true);
  },
  async reauthorize() { const p = await this.dir.requestPermission({ mode: 'readwrite' }); if (p === 'granted') { this.state = 'ok'; this.paint(); await this.run(true); } else toast('Permissão não concedida.'); },
  async disable() { clearInterval(this.timer); try { await this._put(null); } catch (e) {} localStorage.removeItem('cemh:bkOn'); this.dir = null; this.state = 'off'; this.paint(); },
  fileName(d) { const z = n => String(n).padStart(2, '0'); return 'backup-' + z(d.getHours()) + '-' + z(d.getMinutes()) + '_' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '.json'; },
  async run(manual) {
    if (!this.dir || !App.H || this.busy) { if (manual && !App.H) toast('Abra uma homologação para fazer backup.'); return false; }
    this.busy = true;
    try {
      const now = new Date(), name = this.fileName(now);
      const fh = await this.dir.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(JSON.stringify(buildJsonObj(App.H), null, 2)); await w.close();
      localStorage.setItem('cemh:bkLast', String(now.getTime())); localStorage.setItem('cemh:bkName', name); this.state = 'ok'; this.paint();
      if (manual) toast('Backup salvo: ' + name, 4000); return true;
    } catch (e) {
      console.error('Backup falhou', e); this.state = (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) ? 'perm' : 'error'; this.paint();
      toast('Backup falhou: ' + (e.message || e.name) + (this.state === 'perm' ? ' — clique em "Reativar backup".' : ''), 6000); return false;
    } finally { this.busy = false; }
  },
  paint() {
    const b = $('#bbk'); if (!b) return;
    b.textContent = { ok: '💾 Backup ✓', perm: '💾 Reativar backup', error: '💾 Backup ⚠' }[this.state] || '💾 Backup'; b.classList.toggle('pri', this.state === 'perm' || this.state === 'error');
  }
};
function backupModal() {
  const S = Backup.state, last = +localStorage.getItem('cemh:bkLast') || 0, nm = localStorage.getItem('cemh:bkName') || '';
  const next = last ? new Date(last + Backup.INTERVAL) : null;
  let body;
  if (S === 'unsupported') body = `<p>Este navegador (ou este modo de abertura) não permite gravar em pastas do computador. Use o <b>Google Chrome</b> ou o <b>Microsoft Edge</b> no computador, abrindo o site diretamente.</p>`;
  else body = `<p>A cada <b>2 horas</b> o sistema grava um arquivo JSON da homologação aberta na pasta escolhida, com o nome <code>backup-HH-MM_AAAA-MM-DD.json</code>.</p>
    <p class="muted">Pasta: <b>${S === 'off' ? 'nenhuma escolhida' : esc(Backup.dir ? Backup.dir.name : '—')}</b>${last ? '<br>Último backup: <b>' + fmtDate(new Date(last).toISOString(), true) + '</b> (' + esc(nm) + ')' : ''}${next && S === 'ok' ? '<br>Próximo: a partir de <b>' + fmtDate(next.toISOString(), true) + '</b>' : ''}</p>
    ${S === 'off' ? '<p class="tiny">Ao clicar em <b>Escolher pasta</b>, navegue até <b>C:\\Alumisoft\\homologacao</b> (crie a pasta antes, se não existir) e confirme. O navegador pede essa escolha uma única vez.</p>' : ''}
    ${S === 'perm' ? '<p class="n-att">O navegador pediu nova autorização para gravar na pasta. Clique em <b>Reativar backup</b> (depois de reiniciar o navegador isso pode ser necessário).</p>' : ''}
    <p class="tiny">O backup só roda enquanto o site estiver aberto no navegador. Se a aba ficar fechada, os backups são retomados na próxima abertura.</p>`;
  modal(`<h3>Backup automático</h3>${body}<div class="macts"><button class="btn" id="kc">Fechar</button>${S === 'ok' ? '<button class="btn dng" id="koff">Desativar</button><button class="btn" id="kchg">Trocar pasta</button><button class="btn pri" id="know">Fazer backup agora</button>' : ''}${S === 'perm' ? '<button class="btn pri" id="kre">Reativar backup</button>' : ''}${(S === 'off' || S === 'error') ? '<button class="btn pri" id="kch">Escolher pasta</button>' : ''}</div>`, () => {
    $('#kc').onclick = closeModal;
    const wrap = fn => async () => { try { await fn(); closeModal(); } catch (e) { if (e && e.name !== 'AbortError') toast('Erro: ' + (e.message || e.name), 5000); } };
    if ($('#kch')) $('#kch').onclick = wrap(() => Backup.choose()); if ($('#kchg')) $('#kchg').onclick = wrap(() => Backup.choose());
    if ($('#kre')) $('#kre').onclick = wrap(() => Backup.reauthorize()); if ($('#know')) $('#know').onclick = wrap(() => Backup.run(true));
    if ($('#koff')) $('#koff').onclick = wrap(() => Backup.disable());
  });
}

/* ===== STORE: persistência compartilhada (db) com fallback local ===== */
'use strict';
const Store = {
  db: null, mode: 'local', canWrite: true, pending: {}, timers: {}, flushing: {}, metaTimer: null, unsubs: [], onSync: () => {}, onRemoteAba: () => {}, onMetas: () => {},
  async init() {

    try { const u = window.claude && await window.claude.use('user'); if (u) { const w = await u.can('data.write'); if (w === false) this.canWrite = false; this.userName = await u.name(); } } catch (e) {}

  },
  /* ---- metas ---- */
  subscribeMetas() {
    if (this.db) {
      this.unsubs.push(this.db.collection('homologacoes').onSnapshot(snap => this.onMetas(snap.docs.map(d => Object.assign({ id: d.id }, d.data()))), e => this.onSync('error', e)));
    } else this.onMetas(this._localMetas());
  },
  _localMetas() { try { return JSON.parse(localStorage.getItem('cemh:metas') || '[]'); } catch (e) { return []; } },
  _localSetMetas(l) { try { localStorage.setItem('cemh:metas', JSON.stringify(l)); } catch (e) { this.onSync('error', e); } this.onMetas(l); },
  /* ---- carregar ---- */
  async loadH(id) {
    if (this.db) {
      const m = await this.db.doc('homologacoes/' + id).get(); if (!m.exists) throw new Error('Homologação não encontrada');
      const snap = await this.db.collection('homologacoes/' + id + '/abas').get();
      const abas = snap.docs.map(d => docToAba(d.data())).sort((a, b) => a.ord - b.ord);

      snap.docChanges().forEach(ch => { if (ch.type !== 'removed') this.onRemoteAba(id, docToAba(ch.doc.data())); else this.onRemoteAbaRemoved && this.onRemoteAbaRemoved(id, ch.doc.id); });

  patchItem(H, abaId, itemId, patch) {

    clearTimeout(this.timers[abaId]); this.onSync('saving');

  patchAba(H, abaId, patch) {

  async createAba(H, aba) {

  async saveMeta(H) {

  },

  },
  async createH(H) {

  },

    const local = this._localMetas(); if (!local.length) return;

  async getModelo() {

let rt = 0;
function bindStore() {

    if (sameStruct && JSON.stringify(old.itens) === JSON.stringify(aba.itens)) { old.sidx = aba.sidx; old.rawNames = aba.rawNames; return; }
    const byId = {}; old.itens.forEach(it => { byId[it.id] = JSON.stringify(it); }); const changed = aba.itens.filter(it => byId[it.id] !== JSON.stringify(it)); H.abas[i] = aba;
    clearTimeout(rt); rt = setTimeout(() => {

      else { renderRemote(); if (popEl && popCtx && popCtx.abaId === aba.id) fillPop(); }
    }, 150);
  };
  Store.onRemoteAbaRemoved = (id, abaId) => {
    const H = App.H; if (!H || H.id !== id || !H.abas.some(a => a.id === abaId) || H.abas.length <= 1) return;
    H.abas = H.abas.filter(a => a.id !== abaId); if (App.abaId === abaId) App.abaId = H.abas[0].id; clearTimeout(rt); rt = setTimeout(renderRemote, 150);
